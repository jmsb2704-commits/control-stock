<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Stock - Uniformes Xalapa 2000</title>
    <!-- 🎨 ENLACE AL NUEVO ARCHIVO DE DISEÑO INDEPENDIENTE -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        
        <!-- 📸 CABECERA OFICIAL CON EL LOGOTIPO DE FACEBOOK -->
        <div class="brand-header">
            <img src="https://fbcdn.net" alt="Logo Uniformes Xalapa 2000">
        </div>
        
        <!-- 👥 CONTROL DE USUARIOS -->
        <div class="user-section">
            <label for="usuario-activo">👤 Atendido por:</label>
            <div class="user-wrapper">
                <select id="usuario-activo" onchange="evaluarSeleccionUsuario()"></select>
                <button class="btn-delete-user" onclick="eliminarUsuarioActivo()">🗑️</button>
            </div>
        </div>
        
        <h2 id="titulo-formulario">Añadir Nuevo Uniforme</h2>
        
        <div class="form-group">
            <label for="nombre">Nombre del Producto (Modelo / Equipo):</label>
            <input type="text" id="nombre" placeholder="Ej. UNIFORME REAL MADRID">
        </div>
        
        <div class="form-group">
            <label for="color">Color:</label>
            <input type="text" id="color" placeholder="Ej. Blanco, Rosa, Negro">
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="manga">Tipo de Manga:</label>
                <select id="manga">
                    <option value="Manga Corta">Manga Corta</option>
                    <option value="Manga Larga">Manga Larga</option>
                </select>
            </div>
            <div class="form-group">
                <label for="version">Versión:</label>
                <select id="version">
                    <option value="Fan">Fan (Aficionado)</option>
                    <option value="Jugador">Jugador (Match)</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="p-costo">Precio Costo ($):</label>
                <input type="number" id="p-costo" value="0" min="0">
            </div>
            <div class="form-group">
                <label for="p-venta">Precio Venta ($):</label>
                <input type="number" id="p-venta" value="0" min="0">
            </div>
        </div>

        <div class="form-group">
            <label for="foto">📸 Foto del Artículo (Opcional):</label>
            <input type="file" id="foto" accept="image/*">
            <div id="preview-container" style="margin-top: 8px; display: none;">
                <small style="display:block; margin-bottom:4px; color:#666;">Foto actual:</small>
                <img id="foto-preview" src="" style="width: 50px; height: 50px; border-radius: 6px; object-fit: cover; border: 1px solid #ccc;">
            </div>
        </div>
        
        <div class="form-group">
            <label>Cantidades Iniciales por Talla:</label>
            <div class="tallas-grid">
                <div class="talla-item"><label>CH</label><input type="number" id="talla-CH" value="0" min="0"></div>
                <div class="talla-item"><label>M</label><input type="number" id="talla-M" value="0" min="0"></div>
                <div class="talla-item"><label>G</label><input type="number" id="talla-G" value="0" min="0"></div>
                <div class="talla-item"><label>XG</label><input type="number" id="talla-XG" value="0" min="0"></div>
                <div class="talla-item"><label>XXG</label><input type="number" id="talla-XXG" value="0" min="0"></div>
            </div>
        </div>
        
        <button class="btn" id="btn-guardar-principal" onclick="procesarLoteConFoto()">📦 Guardar Lote Completo</button>
        
        <h2>Inventario Actual</h2>
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>CH</th>
                    <th>M</th>
                    <th>G</th>
                    <th>XG</th>
                    <th>XXG</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-productos"></tbody>
        </table>
        <h2>📜 Historial de Actividad (Hoy)</h2>
        <ul id="lista-historial" class="historial-lista"></ul>
    </div>

    <!-- VENTANA EMERGENTE (MODAL) -->
    <div class="modal-overlay" id="modal-salida">
        <div class="modal-box">
            <h3 id="modal-titulo-prod">Registrar Salida de Mercancía</h3>
            <div class="form-group">
                <label for="modal-talla">Seleccionar Talla a retirar:</label>
                <select id="modal-talla"></select>
            </div>
            <div class="form-group">
                <label for="modal-cantidad">Cantidad de piezas que salen:</label>
                <input type="number" id="modal-cantidad" value="1" min="1">
            </div>
            <div class="form-group">
                <label for="modal-motivo">Motivo de la Salida:</label>
                <select id="modal-motivo" onchange="alternarCampoPrecioModal()">
                    <option value="VENTA">💸 Venta Real del Mostrador</option>
                    <option value="MERMA">⚠️ Merma / Artículo Dañado / Pérdida</option>
                </select>
            </div>
            <div class="form-group" id="modal-precio-row">
                <label for="modal-precio-venta">Precio de Venta Real Cobrado ($):</label>
                <input type="number" id="modal-precio-venta" value="0" min="0">
                <small style="color: #666; display:block; margin-top:4px;">*Puedes modificarlo si diste descuento o cambió el precio.</small>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="cerrarModalSalida()">❌ Cancelar</button>
                <button class="btn" style="margin-top:0;" onclick="ejecutarSalidaFinanciera()">💾 Confirmar Salida</button>
            </div>
        </div>
    </div>

    <script src="salidas.js"></script>
    <script src="app.js"></script>
</body>
</html>
