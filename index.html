<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Stock - Uniformes Deportivos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background-color: #f4f4f9; color: #333; }
        h1, h2 { text-align: center; color: #222; margin: 15px 0 10px 0; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); box-sizing: border-box; }
        .user-section { background: #e2e3e5; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .user-wrapper { display: flex; align-items: center; gap: 8px; flex-grow: 1; justify-content: flex-end; }
        .user-section select { padding: 8px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 65%; max-width: 200px; background-color: white; }
        .btn-delete-user { background: #dc3545; color: white; border: none; border-radius: 6px; padding: 8px 12px; font-size: 15px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; background-color: white; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input[type="file"] { padding: 8px; font-size: 14px; background: #fff; }
        .tallas-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 5px; }
        .talla-item { text-align: center; }
        .talla-item label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: bold; }
        .talla-item input { padding: 10px 2px; text-align: center; font-size: 15px; width: 100%; box-sizing: border-box; }
        
        .btn { display: block; width: 100%; padding: 14px; margin-top: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; text-align: center; }
        .btn-edit-mode { background: #007bff; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 12px 8px; text-align: left; }
        th { background-color: #e9ecef; font-weight: bold; text-align: center; }
        
        .col-prod-container { display: flex; align-items: center; gap: 10px; }
        .img-prod { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #eee; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .col-prod { text-align: left; font-weight: bold; }
        .col-prod small { display: block; font-weight: normal; color: #666; margin-top: 3px; font-size: 11px; line-height: 1.3; }
        .col-prod .badge-dinero { color: #2e7d32; font-size: 11px; font-weight: bold; display: block; margin-top: 2px; }
        
        .col-talla { text-align: center; font-size: 14px; font-weight: bold; min-width: 40px; }
        .badge-stock { display: inline-block; background: #f1f3f5; padding: 6px 10px; border-radius: 6px; color: #333; }
        
        .row-actions { display: flex; flex-direction: column; gap: 5px; align-items: center; min-width: 110px; }
        .btn-row-action { width: 100%; border: none; border-radius: 6px; padding: 8px; font-size: 12px; cursor: pointer; font-weight: bold; color: white; display: block; text-align: center; box-sizing: border-box; }
        .btn-out-panel { background: #dc3545; } 
        .btn-edit { background: #ffc107; color: #212529; }
        .btn-delete { background: #6c757d; }

        .historial-lista { background: #fff5f5; border: 1px solid #ddd; padding: 10px; border-radius: 8px; max-height: 180px; overflow-y: auto; font-size: 13px; list-style-type: none; padding-left: 0; }
        .historial-lista li { padding: 6px 0; border-bottom: 1px solid #eee; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; display: none; }
        .modal-box { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); box-sizing: border-box; }
        .modal-box h3 { margin-top: 0; color: #222; text-align: center; margin-bottom: 15px; }
        .modal-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-cancel { background: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👕 Control de Stock v5</h1>
        
        <div class="user-section">
            <label for="usuario-activo">👤 Atendido por:</label>
            <div class="user-wrapper">
                <select id="usuario-activo" onchange="evaluarSeleccionUsuario()"></select>
                <button class="btn-delete-user" onclick="eliminarUsuarioActivo()">🗑️</button>
            </div>
        </div>
        
        <h2 id="titulo-formulario">Añadir Nuevo Uniforme</h2>
        
        <div class="form-group">
            <label for="nombre">Nombre del Producto (Modelo / Equipo):</label>
            <input type="text" id="nombre" placeholder="Ej. UNIFORME REAL MADRID">
        </div>
        
        <div class="form-group">
            <label for="color">Color:</label>
            <input type="text" id="color" placeholder="Ej. Blanco, Rosa, Negro">
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="manga">Tipo de Manga:</label>
                <select id="manga">
                    <option value="Manga Corta">Manga Corta</option>
                    <option value="Manga Larga">Manga Larga</option>
                </select>
            </div>
            <div class="form-group">
                <label for="version">Versión:</label>
                <select id="version">
                    <option value="Fan">Fan (Aficionado)</option>
                    <option value="Jugador">Jugador (Match)</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="p-costo">Precio Costo ($):</label>
                <input type="number" id="p-costo" value="0" min="0">
            </div>
            <div class="form-group">
                <label for="p-venta">Precio Venta ($):</label>
                <input type="number" id="p-venta" value="0" min="0">
            </div>
        </div>

        <div class="form-group">
            <label for="foto">📸 Foto del Artículo (Opcional):</label>
            <input type="file" id="foto" accept="image/*">
            <div id="preview-container" style="margin-top: 8px; display: none;">
                <small style="display:block; margin-bottom:4px; color:#666;">Foto actual:</small>
                <img id="foto-preview" src="" style="width: 50px; height: 50px; border-radius: 6px; object-fit: cover; border: 1px solid #ccc;">
            </div>
        </div>
        
        <div class="form-group">
            <label>Cantidades Iniciales por Talla:</label>
            <div class="tallas-grid">
                <div class="talla-item"><label>CH</label><input type="number" id="talla-CH" value="0" min="0"></div>
                <div class="talla-item"><label>M</label><input type="number" id="talla-M" value="0" min="0"></div>
                <div class="talla-item"><label>G</label><input type="number" id="talla-G" value="0" min="0"></div>
                <div class="talla-item"><label>XG</label><input type="number" id="talla-XG" value="0" min="0"></div>
                <div class="talla-item"><label>XXG</label><input type="number" id="talla-XXG" value="0" min="0"></div>
            </div>
        </div>
        
        <button class="btn" id="btn-guardar-principal" onclick="procesarLoteConFoto()">📦 Guardar Lote Completo</button>
        
        <h2>Inventario Actual</h2>
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>CH</th>
                    <th>M</th>
                    <th>G</th>
                    <th>XG</th>
                    <th>XXG</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-productos"></tbody>
        </table>
        <h2>📜 Historial de Actividad (Hoy)</h2>
        <ul id="lista-historial" class="historial-lista"></ul>
    </div>

        <!-- 🚨 LA VENTANA EMERGENTE (MODAL) PERFECTAMENTE ALINEADA -->
    <div class="modal-overlay" id="modal-salida">
        <div class="modal-box">
            <h3 id="modal-titulo-prod">Registrar Salida de Mercancía</h3>
            
            <div class="form-group">
                <label for="modal-talla">Seleccionar Talla a retirar:</label>
                <select id="modal-talla"></select>
            </div>
            
            <div class="form-group">
                <label for="modal-cantidad">Cantidad de piezas que salen:</label>
                <input type="number" id="modal-cantidad" value="1" min="1">
            </div>
            
            <div class="form-group">
                <label for="modal-motivo">Motivo de la Salida:</label>
                <select id="modal-motivo" onchange="alternarCampoPrecioModal()">
                    <option value="VENTA">💸 Venta Real del Mostrador</option>
                    <option value="MERMA">⚠️ Merma / Artículo Dañado / Pérdida</option>
                </select>
            </div>

            <div class="form-group" id="modal-precio-row">
                <label for="modal-precio-venta">Precio de Venta Real Cobrado ($):</label>
                <input type="number" id="modal-precio-venta" value="0" min="0">
                <small style="color: #666; display:block; margin-top:4px;">*Puedes modificarlo si diste descuento o cambió el precio.</small>
            </div>
            
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="cerrarModalSalida()">❌ Cancelar</button>
                <button class="btn" style="margin-top:0;" onclick="ejecutarSalidaFinanciera()">💾 Confirmar Salida</button>
            </div>
        </div>
    </div>

    <script src="salidas.js"></script>
    <script src="app.js"></script>
</body>
</html>
